body{margin:0;background:linear-gradient(160deg,#1b5cae,#4aa3e0 55%,#2a6fc2) fixed;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}

svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.fb{width:40px;height:40px;border:0;border-left:1px solid var(--ln);background:none;color:var(--navy);border-radius:0;display:flex;align-items:center;justify-content:center}
.st{display:flex;justify-content:space-between;align-items:center;margin:20px 18px 10px}
.st h2{margin:0;font-size:18px;font-weight:700}
.st button{border:0;background:none;color:var(--mu);font-size:13px;font-weight:600}
.rw{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:4px 18px 10px}
.rw::-webkit-scrollbar{display:none}

.lst{padding:0 18px}

  if(weak)return[p,"v-wr","Ada pilihan di luar kategori Prioritas atau bukan hasil yang diprediksi, jadi risikonya lebih besar. Rata-rata 1 dari "+r+" kali semua benar."];
  return[p,"v-ok","Gabungan masih masuk akal, tetapi tetap berisiko. Rata-rata sekitar 1 dari "+r+" kali semua benar."]}
function auto(){let C=D.filter(m=>m.label==="Prioritas").sort((a,b)=>b.mx-a.mx);if(C.length<2)C=[...D].sort((a,b)=>b.mx-a.mx);
  const used=new Set(),out=[];C.forEach(m=>{if(out.length<3&&!used.has(m.lg)){used.add(m.lg);out.push(m)}});
  C.forEach(m=>{if(out.length<3&&!out.includes(m))out.push(m)});
  picks.clear();out.forEach(m=>picks.set(m.key,m.best));simR=null;note="Dipilih otomatis: laga dengan peluang tertinggi dari liga berbeda.";render()}
function simulate(){const ps=[...picks].map(([k,o])=>pr(BY[k],o)),n=ps.length,N=5000,c=Array(n+1).fill(0);
  for(let t=0;t<N;t++){let w=0;ps.forEach(p=>{if(Math.random()<p)w++});c[w]++}simR={n,c,N};render()}
function parlayView(v){v.appendChild(hdr("Parlay","Racik dan uji kombinasi Anda"));
  if(!picks.size){v.appendChild(empty("Belum ada pilihan. Buka detail laga lalu pilih hasilnya, atau biarkan aplikasi meracik untuk Anda.","Racik otomatis",auto));return}
  const [p,cl,tx]=verdict();
  const s=el("div","sum");s.append(el("span",0,picks.size+" pilihan, peluang semua benar"),el("b",0,(p*100).toFixed(1)+"%"));v.appendChild(s);
  v.appendChild(el("div","vd "+cl,tx));if(note)v.appendChild(el("div","vd v-in",note));
  const box=el("div","lst");
  picks.forEach((k,key)=>{const m=BY[key],r=el("div","row"),t=el("div","tx");
    t.append(el("b",0,nm(m,k)),el("small",0,m.h+" vs "+m.a+", "+pc(pr(m,k))+"%"));
    const x=el("button","xr","\u00d7");x.setAttribute("aria-label","Hapus");x.onclick=()=>{picks.delete(key);simR=null;note="";render()};
    r.append(t,x);r.firstChild.onclick=()=>openM(m);box.appendChild(r)});
  v.appendChild(box);
  const a=el("div","acts");a.style.marginTop="14px";
  const b1=el("button","btn lt","Racik ulang"),b2=el("button","btn","Simulasi 5.000x");b1.onclick=auto;b2.onclick=simulate;a.append(b1,b2);v.appendChild(a);
  if(simR&&simR.n===picks.size){const w=el("div","sim");w.appendChild(el("h3",0,"Hasil 5.000 percobaan"));
    for(let i=simR.n;i>=0;i--){const pcn=simR.c[i]/simR.N*100,r=el("div","br"+(i===simR.n?" all":""));
      const bar=el("div"),fill=el("div");fill.style.width=pcn+"%";bar.appendChild(fill);r.append(el("span",0,i===simR.n?"Semua benar":i+" benar"),bar,el("span",0,pcn.toFixed(1)+"%"));w.appendChild(r)}
    w.appendChild(el("p","cap","Simulasi mengandaikan tiap laga berdiri sendiri. Hasilnya menggambarkan seberapa sering kombinasi ini gagal."));v.appendChild(w)}
  const c=el("button","btn lt","Kosongkan parlay");c.style.margin="0 18px";c.style.width="calc(100% - 36px)";c.onclick=()=>{picks.clear();simR=null;note="";render()};v.appendChild(c)}
function accView(v){v.appendChild(hdr("Akurasi","Prediksi dicocokkan dengan hasil asli"));
  if(!ACC||!ACC.n){v.appendChild(empty("Pelacak mulai merekam sejak update ini. Hasil laga yang sudah selesai akan muncul di sini setelah update berikutnya."));return}
  const s=el("div","sum");s.append(el("span",0,"Tebakan hasil benar dari "+ACC.n+" laga"),el("b",0,pc(ACC.hit)+"%"));v.appendChild(s);
  const br=ACC.brier,bs=ACC.base,bt=br<bs;
  v.appendChild(el("div","vd "+(bt?"v-ok":"v-wr"),"Skor Brier "+br.toFixed(3)+" (acuan menebak rata 0,667; makin kecil makin baik). "+(bt?"Model lebih baik dari tebakan acak.":"Model belum mengalahkan tebakan acak.")));
  if(ACC.n<30)v.appendChild(el("div","vd v-in","Sampel masih kecil ("+ACC.n+" laga). Angka baru stabil setelah puluhan laga."));
  function bars(title,rows,cap){const w=el("div","sim");w.appendChild(el("h3",0,title));
    rows.forEach(([l,x])=>{const r=el("div","br"),bar=el("div"),f=el("div");f.style.width=(x?x.hit*100:0)+"%";bar.appendChild(f);r.append(el("span",0,l),bar,el("span",0,x?pc(x.hit)+"%":"-"));w.appendChild(r)});
    if(cap)w.appendChild(el("p","cap",cap));v.appendChild(w)}
  bars("Ketepatan per label",["Prioritas","Pertimbangkan","Hindari"].map(k=>[k,ACC.by[k]]));
  const K=[["hi","Yakin 65%+"],["mid","Yakin 50-65%"],["lo","Di bawah 50%"]];
  bars("Apakah keyakinan model jujur?",K.map(([k,l])=>[l,ACC.bk[k]]),"Klaim rata-rata model: "+K.map(([k,l])=>ACC.bk[k]?l+" = "+pc(ACC.bk[k].avg)+"%":"").filter(Boolean).join(", ")+". Makin dekat dengan batang di atas, makin jujur.");
  const h=el("div","st");h.appendChild(el("h2",0,"Hasil terakhir"));v.appendChild(h);
  const box=el("div","lst");
  ACC.recent.forEach(x=>{const r=el("div","row"),t=el("div","tx"),pk=x.pick==="h"?x.h+" menang":x.pick==="a"?x.a+" menang":"Seri";
    t.append(el("b",0,x.h+" "+x.sc.replace("-"," - ")+" "+x.a),el("small",0,"Tebakan: "+pk));
    r.append(t,el("span","pill "+(x.ok?"p-Prioritas":"p-Hindari"),x.ok?"Benar":"Salah"));box.appendChild(r)});
  v.appendChild(box)}
function nav(){const n=$("#nav");n.replaceChildren();
  [["home","home","Beranda"],["cal","cal","Jadwal"],["fav","heart","Favorit"],["acc","chart","Akurasi"],["par","tick","Parlay"]].forEach(([k,i,l])=>{
    const b=el("button","nb"+(tab===k?" on":""));b.append(ic(i),el("span",0,l));
    if(k==="par"&&picks.size)b.appendChild(el("span","bg",String(picks.size)));
    b.setAttribute("aria-label",l);b.onclick=()=>{det=null;tab=k;render();window.scrollTo(0,0)};n.appendChild(b)})}
function pois(k,l){let f=1;for(let i=2;i<=k;i++)f*=i;return Math.exp(-l)*Math.pow(l,k)/f}
function detail(){const o=$("#ov");if(!det){o.hidden=true;o.replaceChildren();return}
  const m=det,g=GR[m.lg]||["#0a3d8f","#3a8fd9"];o.hidden=false;o.replaceChildren();
  const w=el("div","ov-in"),h=el("div","hero pitch");h.style.background=`linear-gradient(165deg,${g[0]},${g[1]})`;
  const bk=el("button","ib");bk.appendChild(ic("back"));bk.style.left="12px";bk.setAttribute("aria-label","Kembali");bk.onclick=()=>{det=null;render()};
  const hh=heart(m,"ib");hh.style.right="12px";hh.style.position="absolute";
  const shb=el("button","ib");shb.appendChild(ic("share"));shb.style.right="62px";shb.setAttribute("aria-label","Bagikan");shb.onclick=()=>share(m);
  const bg=el("div","big",pc(m.mx)+"%");bg.appendChild(el("small",0,nm(m,m.best)));
  const gl=el("div","gl"),l=el("div");l.append(el("b",0,m.h+" vs "+m.a),el("span",0,m.lg+", "+(tagDay(m)||dl(m))+", "+tm(m)+" WIB"));
  gl.append(l,el("span","pill p-"+m.label,m.label));h.append(bk,hh,shb,bg,gl);w.appendChild(h);
  const tb=el("div","tabs");tb.setAttribute("role","tablist");
  [["r","Ringkasan"],["p","Pasar"],["d","Detail"]].forEach(([k,t])=>{const b=el("button",0,t);b.setAttribute("role","tab");b.setAttribute("aria-selected",dtab===k);b.onclick=()=>{dtab=k;detail()};tb.appendChild(b)});w.appendChild(tb);
  if(dtab==="p"){pasar(w,m)}
  else if(dtab==="r"){
    const g3=el("div","oc3");
    [["h",m.h],["d","Seri"],["a",m.a]].forEach(([k,lb])=>{const b=el("button","oc"+(m.best===k?" pr":""));b.append(el("span",0,lb),el("b",0,pc(pr(m,k))+"%"));
      b.setAttribute("aria-pressed",picks.get(m.key)===k);b.setAttribute("aria-label",nm(m,k)+" "+pc(pr(m,k))+" persen, pilih untuk parlay");
      b.onclick=()=>{picks.get(m.key)===k?picks.delete(m.key):picks.set(m.key,k);simR=null;note="";nav();detail()};g3.appendChild(b)});
    w.appendChild(g3);
    const sg=el("div","sg");
    [["ball","Skor paling mungkin",m.sc[0]+" - "+m.sc[1]],["goal","Perkiraan gol",m.xh.toFixed(1)+" - "+m.xa.toFixed(1)],["up","Over 2.5 gol",pc(m.o25)+"%"],["goal","Kedua tim cetak gol",pc(m.btts)+"%"]].forEach(([i,a,b])=>{
      const c=el("div","sc"),t=el("div");t.append(a,Object.assign(el("b"),{textContent:b}));c.append(ic(i),t);sg.appendChild(c)});
    w.appendChild(sg);
    w.appendChild(el("p","txt","Penilaian "+m.label+". Ketuk salah satu hasil di atas untuk memasukkannya ke parlay."));
    const ul=el("ul","why");m.why.forEach(x=>ul.appendChild(el("li",0,x)));w.appendChild(ul);
  }else{
    w.appendChild(el("p","txt","Peluang skor akhir menurut model gol. Baris adalah gol "+m.h+", kolom adalah gol "+m.a+"."));
    const hm=el("div","hm");hm.appendChild(el("i"));for(let j=0;j<5;j++)hm.appendChild(el("i",0,String(j)));
    let mxp=0;const gr=[];for(let i=0;i<5;i++){gr[i]=[];for(let j=0;j<5;j++){gr[i][j]=pois(i,m.xh)*pois(j,m.xa);mxp=Math.max(mxp,gr[i][j])}}
    for(let i=0;i<5;i++){hm.appendChild(el("i",0,String(i)));for(let j=0;j<5;j++){const c=el("div",0,(gr[i][j]*100).toFixed(0));c.style.background=`rgba(31,111,208,${(.08+.8*gr[i][j]/mxp).toFixed(2)})`;if(gr[i][j]/mxp>.6)c.style.color="#fff";hm.appendChild(c)}}
    w.appendChild(hm);w.appendChild(el("p","cap","Angka dalam persen. Semakin biru, semakin mungkin."));
    const fm=el("div","fm");[[m.h,m.fh],[m.a,m.fa]].forEach(([n,v])=>{const r=el("div","l");r.append(el("span",0,n),el("b",0,v+" dari 15 poin"));const t=el("div","t"),f=el("div");f.style.width=v/15*100+"%";t.appendChild(f);fm.append(r,t)});
    w.append(el("p","txt","Form 5 laga terakhir"),fm);
    if(m.eh){const em=el("div","fm");[[m.h,m.eh],[m.a,m.ea]].forEach(([n,v])=>{const r=el("div","l");r.append(el("span",0,n),el("b",0,"Elo "+v));const t=el("div","t"),f=el("div");f.style.width=Math.max(5,Math.min(100,(v-1300)/4))+"%";t.appendChild(f);em.append(r,t)});w.append(el("p","txt","Rating Elo (kekuatan relatif tim musim ini)"),em)}
  }
  const ct=el("div","cta"),cb=el("button","btn");const has=picks.has(m.key);
  cb.textContent=has?"Hapus dari parlay":"Tambah ke parlay";
  cb.onclick=()=>{has?picks.delete(m.key):picks.set(m.key,m.best);simR=null;note="";nav();detail()};ct.appendChild(cb);w.appendChild(ct);o.appendChild(w);o.scrollTop=0}
const fl=l=>(l>0?"+":"")+l;
function pasar(w,m){
  if(!m.ah){w.appendChild(el("p","txt","Data pasar belum tersedia untuk laga ini. Jalankan update lagi."));return}
  const R=m.rec||{},tn=k=>k==="h"?m.h:m.a;
  const a=el("div","rc");a.appendChild(el("small",0,"Rekomendasi handicap"));
  if(R.ah){a.appendChild(el("b",0,tn(R.ah.side)+" "+fl(R.ah.line)+" ("+pc(R.ah.p)+")"));
    a.appendChild(el("div","nt",R.ah.push>0.005?"Peluang tembus tanpa menghitung push. Peluang push "+pc(R.ah.push)+": taruhan dikembalikan.":"Peluang tembus berdasarkan model gol."))}
  else{a.appendChild(el("b",0,"Tidak ada keunggulan jelas"));a.appendChild(el("div","nt","Tidak ada garis yang melewati 60% untuk tim unggulan."))}
  w.appendChild(a);
  const o=el("div","rc");o.appendChild(el("small",0,"Kecenderungan Over/Under"));
  if(R.ou){o.appendChild(el("b",0,(R.ou.dir==="over"?"Over ":"Under ")+R.ou.line+" gol ("+pc(R.ou.p)+")"))}
  else o.appendChild(el("b",0,"Tidak ada kecenderungan jelas"));
  o.appendChild(el("div","nt","Perkiraan total gol "+m.etg.toFixed(1)));w.appendChild(o);
  const k=el("div","rc");k.appendChild(el("small",0,"Total korner"));k.appendChild(el("b",0,"Belum tersedia"));
  k.appendChild(el("div","nt","Sumber data gratis yang dipakai tidak menyertakan statistik korner, jadi angkanya tidak saya karang."));w.appendChild(k);
  function bars(title,cap,rows){const b=el("div","sim");b.appendChild(el("h3",0,title));
    rows.forEach(([l,p,t])=>{const r=el("div","br"),bar=el("div"),f=el("div");f.style.width=p*100+"%";bar.appendChild(f);r.append(el("span",0,l),bar,el("span",0,t||pc(p)+"%"));b.appendChild(r)});
    if(cap)b.appendChild(el("p","cap",cap));w.appendChild(b)}
  bars("Handicap untuk "+m.h,"Batang adalah peluang tembus tanpa menghitung push. Garis bulat (-1, 0, +1) bisa berakhir push dan taruhan kembali.",
    m.ah.map(([L,wn,pu,ls])=>[fl(L),wn+ls>0?wn/(wn+ls):0]));
  bars("Over / Under gol","Persentase adalah peluang Over. Under adalah sisanya.",m.ou.map(([ln,ov])=>["Over "+ln,ov]));
  w.appendChild(el("p","txt","Ini kecenderungan statistik dari model gol, bukan nilai taruhan: tanpa odds, tidak bisa dipastikan apakah sebuah garis menguntungkan."))}
function openM(m){det=m;dtab="r";detail()}
function sheet(){const s=$("#shh");s.replaceChildren();const b=el("div","sh"),p=el("div","shp");
  p.appendChild(el("h3",0,"Filter"));const r=el("div","rw");
  [[null,"Semua liga"],...[...new Set(D.map(x=>x.lg))].map(x=>[x,x])].forEach(([v,t])=>{const c=el("button","chip",t);c.setAttribute("aria-pressed",lg===v);c.onclick=()=>{lg=v;sheet()};r.appendChild(c)});
  const pc2=el("button","chip","Hanya Prioritas");pc2.setAttribute("aria-pressed",pri);pc2.onclick=()=>{pri=!pri;sheet()};r.appendChild(pc2);
  const ok=el("button","btn","Terapkan");ok.onclick=()=>{s.replaceChildren();render()};
  p.append(r,ok);b.appendChild(p);b.onclick=e=>{if(e.target===b){s.replaceChildren();render()}};s.appendChild(b)}
function render(){view();nav();detail()}
render();

try{if(sessionStorage.getItem("seen"))sp.remove();else{sessionStorage.setItem("seen","1");setTimeout(hide,1600)}}catch(e){setTimeout(hide,1600)}
sp.onclick=hide;sp.onkeydown=e=>{if(e.key==="Enter")hide()};
