<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prediksi Liga Besar</title>
<style>
body{font:16px/1.45 system-ui,sans-serif;margin:0;background:#f2f5f0;color:#14231a}
.w{max-width:760px;margin:0 auto;padding:16px 14px 120px}
h1{font:700 26px Georgia,serif;margin:6px 0}
.c{background:#fff;border:1px solid #d3ddd5;border-radius:10px;padding:12px 14px;margin:10px 0}
.t{display:flex;justify-content:space-between;font-size:13px;color:#5d6e63}
.v{font-weight:700;font-size:17px;margin:4px 0 8px}
.b{display:flex;height:24px;border-radius:5px;overflow:hidden;font-size:13px;font-weight:700;color:#fff}
.b div{display:flex;align-items:center;justify-content:center}
.h{background:#1f6b3a}.d{background:#7b8780}.a{background:#b0822a}
.m{font-size:14px;color:#5d6e63;margin:8px 0}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.Prioritas{background:#dff1e5;color:#1f6b3a}.Pertimbangkan{background:#f7edc8;color:#8a6a10}.Hindari{background:#f6e1dd;color:#a63d2f}
#tray{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #d3ddd5;padding:10px 14px}
button{font:600 14px system-ui;padding:6px 12px;border:1px solid #1f6b3a;border-radius:6px;background:#fff;color:#1f6b3a}
</style></head><body><div class="w">
<h1>Prediksi Liga Besar</h1>
<p class="m">Diperbarui: __UPDATED__. Peluang dari model gol (Poisson), bukan jaminan hasil.</p>
<div id="list"></div>
<p class="m">Saran parlay: pilih paling banyak 2-3 laga berlabel Prioritas, dari laga berbeda. Taruhan ilegal di Indonesia dan berisiko kerugian.</p>
</div><div id="tray" hidden></div>
<script>
const D=__DATA__,sel=new Set(),L=document.getElementById("list");
const pc=x=>Math.round(x*100)+"%";
const top=m=>m.ph>=m.pd&&m.ph>=m.pa?["h",m.ph,m.h+" menang"]:m.pa>=m.pd?["a",m.pa,m.a+" menang"]:["d",m.pd,"Seri"];
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function draw(){
 L.replaceChildren();
 D.forEach((m,i)=>{
  const c=el("div","c"),t=el("div","t");
  t.append(el("span",0,m.lg),el("span",0,new Date(m.t).toLocaleString("id-ID",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"Asia/Jakarta"})+" WIB"));
  const bar=el("div","b");
  [["h",m.ph],["d",m.pd],["a",m.pa]].forEach(([k,p])=>{const s=el("div",k,pc(p));s.style.width=p*100+"%";bar.append(s)});
  const p=top(m),tg=el("span","tag "+m.label,m.label);
  const info=el("div","m",`Skor paling mungkin ${m.sc[0]}-${m.sc[1]} | Over 2.5: ${pc(m.o25)} | Kedua tim cetak gol: ${pc(m.btts)} | Poin 5 laga terakhir: ${m.fh} vs ${m.fa}`);
  const why=el("div","m","Alasan: "+m.why.join(", "));
  const row=el("div","t");const pr=el("span");pr.append("Prediksi: ",el("b",0,p[2]+" ("+pc(p[1])+") "),tg);
  const btn=el("button",0,sel.has(i)?"Dipilih":"Tambah ke parlay");btn.onclick=()=>{sel.has(i)?sel.delete(i):sel.add(i);draw()};
  row.append(pr,btn);
  c.append(t,el("div","v",m.h+" vs "+m.a),bar,info,why,row);L.append(c);
 });
 const tr=document.getElementById("tray");tr.hidden=!sel.size;
 if(sel.size){const pp=[...sel].reduce((s,i)=>s*top(D[i])[1],1);
  tr.textContent=sel.size+" pilihan. Peluang semua benar: "+(pp*100).toFixed(1)+"%"}
}
draw();
</script></body></html>
